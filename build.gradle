buildscript {
    repositories {
        maven {
            url "https://maven.fabricmc.net/"
        }
        mavenCentral()
    }
}
plugins {
    id 'fabric-loom' version '0.6-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = "autodisconnect"
version = "1.0.0"
group = "com.example"

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.14:v2"
    modImplementation "net.fabricmc:fabric-loader:0.11.3"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.32.5+1.16"

    // Cloth Config API
    modApi "me.shedaniel.cloth:cloth-config-fabric:4.11.26"
    include "me.shedaniel.cloth:cloth-config-fabric:4.11.26"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:1.16.22"
}
